[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Lightweight scaffold for Vietnamese legal question answering experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<3.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
]
semantic-reranker = [
    # Optional F2 runtime; base/offline installs stay free of model dependencies.
    "sentence-transformers>=5.0,<6.0",
]
reader = [
    # Optional local-only extractive reader runtime; unit tests use the mock backend.
    "torch>=2.0",
    "transformers>=4.36,<5.0",
    "sentencepiece>=0.1.99",
]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
