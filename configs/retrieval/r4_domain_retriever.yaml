# SEDAR Retrieval v3 — R4 domain retriever (TASK 11)
version: sedar-retrieval-v3
stage: R4
depends_on: R3
status: deferred_gpu

dense:
  model: Qwen/Qwen3-Embedding-4B
  model_revision: PINNED_ON_SERVER
  training: lora_peft
  query_instruction: >-
    Retrieve Vietnamese legal provisions that directly support the answer.
    Prioritize applicable rules, conditions, exceptions, definitions and
    referenced provisions.
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
  optimization:
    epochs: 1
    batch_size: 4
    grad_accum: 4
    learning_rate: 2.0e-5
    max_seq_length: 8192
    seed: 42
  data:
    source_split: train
    validation_fraction: 0.1
    test_fraction: 0.1
  promotion:
    promotion_min_gain: 0.01
    eval_splits:
      - warmup
    metrics:
      - recall_at_20
      - recall_at_50
      - ndcg_at_10

reader:
  frozen: true

runtime:
  outputs_root: reports/ablations/R4
  train_script: scripts/sedar_retrieval/train_retriever_lora.py
  rebuild_script: scripts/sedar_retrieval/rebuild_dense_from_checkpoint.py
