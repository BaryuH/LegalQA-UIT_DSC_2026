# Auxiliary extractive baseline: train-context BM25 plus the exact same checkpoint.
project:
  name: legal-rag
  profile: tuned-bm25-reader
  python_version: "3.11"
data:
  data_dir: data
  question_path: data/ALQAC.csv
  selected_contexts_path: data/selected-contexts.zip
  split: public
  split_policy: public_inference
chunking:
  max_chars: 1200
  overlap_chars: 200
  min_chars: 100
  version: legal-chunker-v1
retrieval:
  strategy: none
  rough_top_n: 1
  k1: 1.5
  b: 0.75
reranker:
  enabled: false
  required: false
  provider: none
evidence:
  evidence_top_k: 1
  max_total_chars: 4000
  max_chunks_per_document: 2
generation:
  provider: mock
  model: unused-by-extractive-reader
  temperature: 0.0
  max_output_chars: 1200
  retries: 0
prompts:
  direct_version: direct-v1
  rag_version: rag-v1
evaluation:
  enabled: false
  reference_access: none
  primary_metric: meteor
  secondary_metric: rouge_l
runtime:
  cache_dir: cache
  outputs_dir: outputs
  artifacts_dir: artifacts
  fail_fast: true
  seed: 42
submission:
  enabled: false
  format: object_by_question_id
  answer_field: answer
  output_filename: submission.zip
  inner_filename: submission.json
  encoding: utf-8
  ensure_ascii: false
  forbid_extra_fields: true
  deterministic_order: dataset
  require_full_coverage: true
  reject_extra_ids: true
  reject_duplicate_ids: true
  reject_non_string_answers: true
  reject_empty_answers: false
reader:
  enabled: true
  mode: train_context_bm25
  dataset_path: data/ALQAC.csv
  split_manifest_path: data/splits/alqac_v1.json
  checkpoint_path: checkpoints/legal_qa_reader/best_model
  checkpoint_manifest_path: checkpoints/legal_qa_reader/checkpoint_manifest.json
  device: auto
  batch_size: 8
  max_seq_length: 384
  doc_stride: 128
  max_answer_length: 50
  retrieval_top_k: 5
  k1: 1.5
  b: 0.75
  local_files_only: true
