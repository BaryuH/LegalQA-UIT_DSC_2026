# SEDAR-SFT Path-B train profile (LTR-aligned evidence, SS-05B).
# Build dataset with scripts/sedar_sft/build_dataset_from_ltr.py, then train with
# scripts/train_finetuned_reader.py --dataset-dir ... --required-evidence-source ltr_passage_rankings
# Do not use this profile with the frozen-B2 builder (build_dataset.py).
project:
  name: legal-rag
  profile: sedar_sft
  python_version: "3.11"
data:
  data_dir: data
  question_path: data/train.json
  selected_contexts_path: data/selected-contexts.zip
  split: train
  split_policy: train_development
chunking:
  max_chars: 1200
  overlap_chars: 200
  min_chars: 100
  version: legal-chunker-v1
retrieval:
  strategy: bm25_rerank
  rough_top_n: 12
  k1: 1.5
  b: 0.75
reranker:
  enabled: true
  required: false
  provider: sentence_transformers
  model: BAAI/bge-m3
  device: cuda
  batch_size: 8
  max_length: 512
# HISTORICAL RECORD — these are the values that produced `sedar-sft-ltr-v1`
# (the reader now deployed as vilegal-sedar-v1). They are deliberately NOT
# updated to the champion renderer, because this block documents what v1 was
# trained on; changing it would erase that.
#
# Two things to know before trusting this block:
#  1. It is not authoritative for the dataset build.
#     scripts/sedar_sft/build_dataset_from_ltr.py takes evidence from CLI flags
#     (--evidence-top-k / --max-total-chars / --max-chunks-per-document,
#     argparse defaults 4 / 4000 / 2) and never reads project.evidence.
#     project.evidence is consumed by pipeline.py and b2_freeze.py only.
#  2. It cannot express the champion renderer, and is not meant to.
#     EvidenceSection is pydantic `extra="forbid"` with exactly these three
#     fields, and it is left that way on purpose: project.evidence feeds
#     pipeline.py and b2_freeze.py, which are frozen paths.
#     The renderer settings live on the dataset builder instead. Since
#     2026-09-07, LtrDatasetBuildConfig and
#     scripts/sedar_sft/build_dataset_from_ltr.py carry all five of
#     candidate_window / body_source / dedup_article_mode /
#     include_document_name / min_passage_chars, with flag names identical to
#     scripts/sedar_retrieval/run_sedar_e2e.py and defaults equal to the
#     historical v1 behaviour.
#
# Reader v2 (READER_RETRAIN_V2_PROPOSAL.md §2.1) therefore needs no edit here.
# It needs the build to be invoked with the champion renderer:
#   --evidence-top-k 6 --max-total-chars 6000 --max-chunks-per-document 3
#   --dedup-article-mode article --include-document-name
# Verify it landed: the dataset manifest must show `renderer_overrides` with
# those two flags, and `retrieval_config_hash` must differ from v1's. A default
# build still reproduces v1's hash exactly - overrides enter the hash only when
# they differ from the defaults. See READER_V2_RUNBOOK.md P1.1.
evidence:
  evidence_top_k: 4
  max_total_chars: 4000
  max_chunks_per_document: 2
generation:
  provider: mock
  model: sedar_sft_backend
  temperature: 0.0
  max_output_chars: 1200
  retries: 0
prompts:
  direct_version: direct-v1
  rag_version: rag-v1
evaluation:
  enabled: false
  reference_access: none
  primary_metric: meteor
  secondary_metric: rouge_l
runtime:
  cache_dir: cache
  outputs_dir: outputs
  artifacts_dir: artifacts
  fail_fast: true
  seed: 42
submission:
  enabled: false
  format: object_by_question_id
  answer_field: answer
  output_filename: submission.zip
  inner_filename: submission.json
  encoding: utf-8
  ensure_ascii: false
  forbid_extra_fields: true
  deterministic_order: dataset
  require_full_coverage: true
  reject_extra_ids: true
  reject_duplicate_ids: true
  reject_non_string_answers: true
  reject_empty_answers: false
finetuned_reader:
  enabled: true
  required: true
  type: generative_sft_reader
  dataset_version: sedar-sft-ltr-v1
  train_prompt_path: configs/prompts/sedar_sft_train_v1.txt
  inference_prompt_path: configs/prompts/sedar_sft_infer_v1.txt
  checkpoint_path: checkpoints/sedar_sft/<run_id>
  checkpoint_manifest_path: checkpoints/sedar_sft/<run_id>/checkpoint_manifest.json
  # Training-time record only; generation length is set per run by
  # run_sedar_e2e.py --max-new-tokens. The deployed champion is 768
  # (SS-06, 2026-09-05). Left at 512 because that is what v1 recorded.
  max_new_tokens: 512
  overlap_policy: exclude_and_record
  overlap_remediation_id: ftr03-train-overlap-exclusion-v1
  stop_sequences: []
  dataset_build:
    bm25_backend: cuda
    progress_every: 100
  model:
    # Locked from vilegal-sedar-v1 checkpoint_manifest (SS-04C / Path B).
    base_model: /mnt/G/sedar-legalqa/models/vilegalqwen3-1.7b-base
    revision: 258c56ed40529cced26fa7fcc3ecc0663e914c18
    tokenizer: /mnt/G/sedar-legalqa/models/vilegalqwen3-1.7b-base
    loader: auto
    context_length: 4096
    dtype: bfloat16
    load_in_4bit: true
    trust_remote_code: false
    local_files_only: true
  lora:
    enabled: true
    adapter_type: qlora
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - down_proj
      - gate_proj
      - k_proj
      - o_proj
      - q_proj
      - up_proj
      - v_proj
    bias: none
  training:
    seed: 42
    # Provisional published model limit; SS-06 must re-select from token stats.
    max_seq_length: 4096
    epochs: 2
    learning_rate: 0.0002
    train_batch_size: 1
    eval_batch_size: 1
    # Provisional; SS-04D/SS-07G may replace with measured AUTO resolution.
    gradient_accumulation_steps: 16
    warmup_ratio: 0.03
    weight_decay: 0.0
    max_grad_norm: 1.0
    logging_steps: 10
    packing: false
    gradient_checkpointing: true
  output:
    dataset_root: artifacts/sedar_sft/datasets
    checkpoint_root: checkpoints/sedar_sft
