# 200-case dev benchmark: Finetuned Reranker (LoRA) + BM25 + Dense v2 + Qwen3.5-2B
run_name: dev200_qwen35_2b_finetuned_reranker
output_dir: benchmark_meteor_matrix/outputs

data:
  path: processed/train_dev200.json
  evidence_path: processed/train_dev200_finetuned_multi_pos_evidence.jsonl
  limit: 200

prompt_template: configs/prompts/rag_detailed_v1.txt

model:
  model_name: alphaedge-ai/Qwen3.5-2B-vie-32768   # <=4B cap: 2B + emb 0.57B + reranker 0.57B
  device: cuda
  dtype: auto
  load_in_4bit: false
  load_in_8bit: false
  attn_implementation: sdpa
  use_chat_template: true
  system_prompt: null
  chat_template_kwargs:
    enable_thinking: false

sampling:
  num_candidates: 4             # 1 greedy + 3 sampled, production longest_grounded selector
  include_greedy: true
  temperature: 0.7
  top_p: 0.95
  epsilon_cutoff: 0.02
  max_new_tokens: 768
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  seed: 0

generation:
  cache_path: benchmark_meteor_matrix/outputs/dev200_qwen35_2b_finetuned_reranker/candidates.jsonl
