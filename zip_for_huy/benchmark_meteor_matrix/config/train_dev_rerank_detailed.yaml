# MBR / METEOR-matrix answer-selection benchmark — Grounded + Reranked + Length-Controlled
# Evaluates Lever #1 (comprehensive detailed prompt + max_tokens 768) and Lever #3 (AITeamVN reranker evidence).
run_name: mbr_meteor_matrix_rerank_detailed_v1
output_dir: benchmark_meteor_matrix/outputs

data:
  path: processed/train_dev50.json
  evidence_path: processed/train_dev50_rerank_evidence.jsonl
  limit: 50

prompt_template: configs/prompts/rag_detailed_v1.txt

model:
  model_name: Qwen/Qwen3-8B
  device: cuda
  dtype: auto
  load_in_4bit: false
  load_in_8bit: true
  use_chat_template: true
  system_prompt: null
  chat_template_kwargs:
    enable_thinking: false

sampling:
  num_candidates: 8
  include_greedy: true
  temperature: 0.7
  top_p: 0.95
  epsilon_cutoff: 0.02
  max_new_tokens: 768
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  seed: 0

utilities:
  primary_lexical: meteor
  enable_ensemble: true
  ensemble:
    - {kind: lexical, metric: meteor, weight: 1.0}
    - {kind: lexical, metric: rouge_l, weight: 0.5}
    - {kind: embedding, weight: 1.0}
  enable_embedding: true
  enable_reranker_prior: true
  embedding_model: AITeamVN/Vietnamese_Embedding
  reranker_model: AITeamVN/Vietnamese_Reranker
  cbmbr_clusters: 3

generation:
  cache_path: benchmark_meteor_matrix/outputs/mbr_meteor_matrix_rerank_detailed_v1/candidates.jsonl
