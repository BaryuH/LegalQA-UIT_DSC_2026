# LEAN dev loop for C+B iteration (MBR dropped).
# Only the production selector (longest_grounded) + baselines run: no pairwise
# matrix, no embedding/reranker/ensemble model loads. ~3-5x faster per run, so
# reranker/evidence/prompt/length changes can be measured cheaply on dev200.
# Use this for every C+B iteration; use train_dev200.yaml once to close MBR.
run_name: dev200_lean_v1
output_dir: benchmark_meteor_matrix/outputs

lean: true

data:
  path: processed/train_dev200.json
  evidence_path: processed/train_dev200_rerank_evidence.jsonl
  limit: 200

prompt_template: configs/prompts/rag_detailed_v1.txt

model:
  model_name: Qwen/Qwen3-8B
  device: cuda
  dtype: auto
  load_in_4bit: false
  load_in_8bit: true
  use_chat_template: true
  system_prompt: null
  chat_template_kwargs:
    enable_thinking: false

sampling:
  num_candidates: 5          # fewer candidates: selection is now O(N), not MBR
  include_greedy: true
  temperature: 0.7
  top_p: 0.95
  epsilon_cutoff: 0.02
  max_new_tokens: 768
  seed: 0

utilities:
  primary_lexical: meteor
  enable_ensemble: false
  enable_embedding: false
  enable_reranker_prior: false

generation:
  cache_path: benchmark_meteor_matrix/outputs/dev200_lean_v1/candidates.jsonl
