# Fast smoke: 3 cases, new model + thinking. Run BEFORE the full 200 to verify
# the <think> strip works on THIS model's tag format and the answer isn't
# truncated by the thinking budget. Inspect outputs/smoke_v1/candidates.jsonl:
# answers must be clean (no <think>), non-empty, reasonable length.
run_name: smoke_v1
output_dir: benchmark_meteor_matrix/outputs

data:
  path: processed/train_dev200.json
  evidence_path: processed/train_dev200_rerank_evidence.jsonl
  limit: 3

prompt_template: configs/prompts/rag_detailed_v1.txt

model:
  model_name: alphaedge-ai/Qwen3.5-2B-vie-32768
  device: cuda
  dtype: auto
  load_in_4bit: false
  load_in_8bit: false
  attn_implementation: sdpa
  use_chat_template: true
  system_prompt: null
  chat_template_kwargs:
    enable_thinking: true

sampling:
  num_candidates: 2
  include_greedy: true
  temperature: 0.7
  top_p: 0.95
  epsilon_cutoff: 0.02
  max_new_tokens: 2048
  seed: 0

generation:
  cache_path: benchmark_meteor_matrix/outputs/smoke_v1/candidates.jsonl
