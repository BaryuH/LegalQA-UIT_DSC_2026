# A/B pair for train_dev200.yaml: same 2B model, thinking OFF.
# Sweep this vs train_dev200.yaml to answer: does thinking actually improve the
# ANSWER (METEOR/ROUGE-L) enough to justify 2-4x more tokens? Thinking is stripped
# from the answer, so it only helps if the reasoning changes the final text.
run_name: dev200_qwen35_2b_nothink_v1
output_dir: benchmark_meteor_matrix/outputs

data:
  path: processed/train_dev200.json
  evidence_path: processed/train_dev200_rerank_evidence.jsonl
  limit: 200

prompt_template: configs/prompts/rag_detailed_v1.txt

model:
  model_name: alphaedge-ai/Qwen3.5-2B-vie-32768
  device: cuda
  dtype: auto
  load_in_4bit: false
  load_in_8bit: false
  attn_implementation: sdpa
  use_chat_template: true
  system_prompt: null
  chat_template_kwargs:
    enable_thinking: false

sampling:
  num_candidates: 4
  include_greedy: true
  temperature: 0.7
  top_p: 0.95
  epsilon_cutoff: 0.02
  max_new_tokens: 768        # no thinking -> smaller budget is enough
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  seed: 0

generation:
  cache_path: benchmark_meteor_matrix/outputs/dev200_qwen35_2b_nothink_v1/candidates.jsonl
