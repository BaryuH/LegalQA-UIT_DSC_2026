# Default pipeline configuration for src_nhan
# Vietnamese Legal RAG-QA with vietlegal-e5 + ViRanker + Qwen3-1.7B

data:
  data_dir: data
  question_path: data/warmup.json
  selected_contexts_path: data/selected-contexts.zip
  split: warmup

chunking:
  max_chars: 1200
  overlap_chars: 200
  min_chars: 100

bm25:
  top_n: 30
  k1: 1.5
  b: 0.75

dense:
  model_name: mainguyen9/vietlegal-e5
  top_n: 30
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 64

hybrid:
  rrf_k: 60
  top_n: 30

reranker:
  enabled: true
  model_name: namdp-ptit/ViRanker
  top_k: 3
  batch_size: 32

generator:
  model_name: thangvip/qwen3-1.7b-vietnamese-legal-grpo-phase-2
  max_new_tokens: 1024
  temperature: 0.0
  do_sample: false
  dtype: auto

evidence:
  max_total_chars: 4000

evaluation:
  enabled: true
  primary_metric: meteor
  secondary_metric: rouge_l

runtime:
  cache_dir: cache_nhan
  outputs_dir: outputs_nhan
  device: auto
  seed: 42
  fail_fast: true
